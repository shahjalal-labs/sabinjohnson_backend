<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ff4e50, #ff7676);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .cancel-box {
        background: #ffffff;
        padding: 40px 30px;
        max-width: 400px;
        width: 100%;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        animation: popup 0.5s ease;
      }

      .cancel-box h1 {
        font-size: 28px;
        color: #d63031;
        margin-bottom: 10px;
      }

      .cancel-box p {
        font-size: 16px;
        color: #444;
        margin-bottom: 20px;
      }

      .icon-error {
        font-size: 60px;
        color: #e74c3c;
        margin-bottom: 15px;
        animation: shake 0.8s ease infinite;
      }

      @keyframes popup {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        50% {
          transform: translateX(4px);
        }
      }

      .button {
        display: inline-block;
        padding: 12px 22px;
        border: none;
        background: #d63031;
        color: #fff;
        border-radius: 50px;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
      }

      .button:hover {
        background: #b71c1c;
      }

      @media (max-width: 480px) {
        .cancel-box {
          padding: 30px 20px;
        }
        .cancel-box h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="cancel-box">
      <div class="icon-error">❌</div>
      <h1>Payment Cancelled</h1>
      <p>Your payment was cancelled. Please try again or contact support.</p>
      <!-- <a href="/" class="button">Try Again</a> -->
    </div>
  </body>
</html>
