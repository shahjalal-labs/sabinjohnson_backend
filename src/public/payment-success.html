<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #0097ee);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        text-align: center;
      }

      .success-box {
        background: #ffffff;
        padding: 40px 30px;
        max-width: 400px;
        width: 100%;
        border-radius: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        animation: popup 0.5s ease;
      }

      .success-box h1 {
        font-size: 28px;
        color: #2e7d32;
        margin-bottom: 10px;
      }

      .success-box p {
        font-size: 16px;
        color: #444;
        margin-bottom: 20px;
      }

      .icon-check {
        font-size: 60px;
        color: #2ecc71;
        margin-bottom: 15px;
        animation: bounce 1s ease infinite;
      }

      .button {
        display: inline-block;
        padding: 12px 22px;
        border: none;
        background: #2ecc71;
        color: #fff;
        border-radius: 50px;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
      }

      .button:hover {
        background: #27ae60;
      }

      @keyframes popup {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      @media (max-width: 480px) {
        .success-box {
          padding: 30px 20px;
        }
        .success-box h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="success-box">
      <div class="icon-check">✔️</div>
      <h1>Payment Successful!</h1>
      <p>
        Your payment was processed successfully. Thank you for your payment!
      </p>

      <!-- <a href="/" class="button">Go to Home</a> -->
    </div>
  </body>
</html>
